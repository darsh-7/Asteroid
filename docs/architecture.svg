<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Asteroid Radar data flow</title>
  <desc id="d">NASA NeoWs and APOD APIs are called through Retrofit. The repository writes asteroids into Room, which the ViewModel observes as LiveData for the RecyclerView. The picture of the day goes straight to the ViewModel. WorkManager runs RefreshWorker once a day to refresh the cache.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" rx="16" ry="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#1f2328">Asteroid Radar: data flow</text>

  <!-- WorkManager -->
  <rect x="30" y="62" width="740" height="76" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="86" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">WorkManager: daily background sync</text>
  <text x="400" y="106" font-size="13" fill="#1f2328" text-anchor="middle">App.onCreate() enqueues a unique PeriodicWorkRequest&lt;RefreshWorker&gt; every 1 day (KEEP)</text>
  <text x="400" y="125" font-size="13" fill="#1f2328" text-anchor="middle">Constraints: unmetered network · charging · battery not low · device idle (API 23+)</text>

  <!-- Row B: network and data -->
  <rect x="30" y="190" width="170" height="96" rx="10" fill="#fff4e5" stroke="#d97706" stroke-width="1.5"/>
  <text x="115" y="214" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">NASA Open APIs</text>
  <text x="115" y="236" font-size="13" fill="#1f2328" text-anchor="middle">api.nasa.gov</text>
  <text x="115" y="254" font-size="13" fill="#1f2328" text-anchor="middle">NeoWs feed (7 days)</text>
  <text x="115" y="272" font-size="13" fill="#1f2328" text-anchor="middle">APOD</text>

  <rect x="220" y="190" width="170" height="96" rx="10" fill="#fff4e5" stroke="#d97706" stroke-width="1.5"/>
  <text x="305" y="214" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Retrofit (ApiMang)</text>
  <text x="305" y="236" font-size="13" fill="#1f2328" text-anchor="middle">Scalars → JSON string</text>
  <text x="305" y="254" font-size="13" fill="#1f2328" text-anchor="middle">hand-parsed to Asteroid</text>
  <text x="305" y="272" font-size="13" fill="#1f2328" text-anchor="middle">Moshi → PictureOfDay</text>

  <rect x="410" y="190" width="170" height="96" rx="10" fill="#e8f1ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="495" y="214" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Repo</text>
  <text x="495" y="236" font-size="13" fill="#1f2328" text-anchor="middle">refreshAsteroids()</text>
  <text x="495" y="254" font-size="13" fill="#1f2328" text-anchor="middle">Dispatchers.IO</text>
  <text x="495" y="272" font-size="13" fill="#1f2328" text-anchor="middle">insertAll (REPLACE)</text>

  <rect x="600" y="190" width="170" height="96" rx="10" fill="#e8f1ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="685" y="214" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Room</text>
  <text x="685" y="236" font-size="13" fill="#1f2328" text-anchor="middle">AsteroidDatabase</text>
  <text x="685" y="254" font-size="13" fill="#1f2328" text-anchor="middle">asteroid table</text>
  <text x="685" y="272" font-size="13" fill="#1f2328" text-anchor="middle">LiveData queries</text>

  <!-- Row C: UI -->
  <rect x="30" y="380" width="170" height="96" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="44" y="402" font-size="13" font-weight="700" fill="#1f2328">Legend</text>
  <line x1="44" y1="422" x2="84" y2="422" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="92" y="426" font-size="13" fill="#1f2328">asteroid list</text>
  <line x1="44" y1="444" x2="84" y2="444" stroke="#57606a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="92" y="448" font-size="13" fill="#1f2328">picture of day</text>
  <text x="44" y="468" font-size="13" fill="#57606a">Room = source of truth</text>

  <rect x="220" y="380" width="170" height="96" rx="10" fill="#eaf7ee" stroke="#16a34a" stroke-width="1.5"/>
  <text x="305" y="404" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">DetailFragment</text>
  <text x="305" y="426" font-size="13" fill="#1f2328" text-anchor="middle">Safe Args (Parcelable)</text>
  <text x="305" y="444" font-size="13" fill="#1f2328" text-anchor="middle">binding adapters</text>
  <text x="305" y="462" font-size="13" fill="#1f2328" text-anchor="middle">AU help dialog</text>

  <rect x="410" y="380" width="170" height="96" rx="10" fill="#eaf7ee" stroke="#16a34a" stroke-width="1.5"/>
  <text x="495" y="404" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">MainFragment</text>
  <text x="495" y="426" font-size="13" fill="#1f2328" text-anchor="middle">RecyclerView</text>
  <text x="495" y="444" font-size="13" fill="#1f2328" text-anchor="middle">ListAdapter + DiffUtil</text>
  <text x="495" y="462" font-size="13" fill="#1f2328" text-anchor="middle">Picasso image of day</text>

  <rect x="600" y="380" width="170" height="96" rx="10" fill="#e8f1ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="685" y="404" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">MainViewModel</text>
  <text x="685" y="426" font-size="13" fill="#1f2328" text-anchor="middle">AndroidViewModel</text>
  <text x="685" y="444" font-size="13" fill="#1f2328" text-anchor="middle">viewModelScope</text>
  <text x="685" y="462" font-size="13" fill="#1f2328" text-anchor="middle">today / week filter</text>

  <!-- Arrows -->
  <g stroke="#57606a" stroke-width="1.8" fill="none">
    <line x1="495" y1="138" x2="495" y2="188" marker-end="url(#arrow)"/>
    <line x1="200" y1="238" x2="218" y2="238" marker-end="url(#arrow)"/>
    <line x1="390" y1="238" x2="408" y2="238" marker-end="url(#arrow)"/>
    <line x1="580" y1="238" x2="598" y2="238" marker-end="url(#arrow)"/>
    <line x1="720" y1="286" x2="720" y2="378" marker-end="url(#arrow)"/>
    <polyline points="305,286 305,348 650,348 650,378" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <line x1="600" y1="428" x2="582" y2="428" marker-end="url(#arrow)"/>
    <line x1="410" y1="428" x2="392" y2="428" marker-end="url(#arrow)"/>
  </g>
  <text x="505" y="168" font-size="13" fill="#57606a">RefreshWorker.doWork()</text>
  <text x="712" y="318" font-size="13" fill="#57606a" text-anchor="end">observe LiveData</text>
  <text x="315" y="340" font-size="13" fill="#57606a">getPictureOfDay() → img LiveData</text>
</svg>
